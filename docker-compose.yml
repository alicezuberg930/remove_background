services:
  birefnet-trainer:
    profiles:
      - train
    build:
      context: .
      dockerfile: Dockerfile.train
    working_dir: /workspace
    shm_size: "8gb"
    gpus: all
    environment:
      HF_HOME: /workspace/.hf-cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - .:/workspace
    command: ["python3", "training/finetune_birefnet.py", "--help"]

  remove-background-service:
    build:
      context: .
    env_file:
      - .env
    environment:
      BIREFNET_TRITON_ENABLED: ${BIREFNET_TRITON_ENABLED:-true}
      BIREFNET_TRITON_URL: ${BIREFNET_TRITON_URL:-http://triton:8000}
      BIREFNET_TRITON_MODEL_NAME: ${BIREFNET_TRITON_MODEL_NAME:-birefnet}
    depends_on:
      triton:
        condition: service_started
    volumes:
      - ./training/runs:/training/runs:ro
    ports:
      - "8010:8010"
    restart: unless-stopped

  triton:
    build:
      context: .
      dockerfile: Dockerfile.triton
    shm_size: "1gb"
    gpus: all
    environment:
      BIREFNET_MODEL_ID: ${BIREFNET_MODEL_ID:-ZhengPeng7/BiRefNet}
      BIREFNET_DEVICE: ${BIREFNET_DEVICE:-}
      BIREFNET_USE_HALF: ${BIREFNET_USE_HALF:-true}
      HF_HOME: /models-cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./triton-model-repository:/models
      - ./training/runs:/training/runs:ro
      - triton_hf_cache:/models-cache/huggingface
    command: ["tritonserver", "--model-repository=/models"]
    restart: unless-stopped

volumes:
  triton_hf_cache:
